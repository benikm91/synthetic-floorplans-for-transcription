readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.1",
    "numpy==1.26.4",
    "pillow==11.1.0",
    "scipy>=1.11",
    "shapely>=2.0",
    "skia-python==87.6",
]
